[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ppdf-hybrid"
version = "1.0.0"
description = "Privacy-Preserving Digital Forensics (PPDF) Hybrid System using Homomorphic Encryption (HE) and Searchable Symmetric Encryption (SSE)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "mpmath>=1.3.0",
    "cryptography>=42.0.0",
]

[project.scripts]
ppdf = "ppdf_main:main"
